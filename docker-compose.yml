services:
  blog:
    image: codeart-blog:latest # 本地/CI 构建后 save 传输，服务器不 build
    container_name: codeart-blog
    restart: unless-stopped
    ports:
      - "127.0.0.1:3040:3001" # 仅本机监听，由宿主 nginx 反代对外
    env_file:
      - .env
    volumes:
      - ./content/articles:/app/content/articles # 文章持久化，写作台写文件直接落盘
