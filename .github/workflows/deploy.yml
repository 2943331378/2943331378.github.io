name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

concurrency:
  group: blog-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像并打包
        run: |
          docker build --platform linux/amd64 -t codeart-blog:latest .
          docker save codeart-blog:latest | gzip > blog-image.tgz
          tar -czf blog-content.tgz content docker-compose.yml

      - name: 上传镜像与文章到服务器
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "blog-image.tgz,blog-content.tgz"
          target: "/tmp/blog-deploy"
          rm: true

      - name: 加载镜像并重建容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /www/wwwroot/my-blog
            tar -xzf /tmp/blog-deploy/blog-content.tgz
            gunzip -c /tmp/blog-deploy/blog-image.tgz | docker load
            docker compose up -d --force-recreate
            docker image prune -f
            rm -rf /tmp/blog-deploy

            echo "--- 容器状态"
            docker ps --format '{{.Names}} {{.Image}} {{.Status}} {{.Ports}}'
            echo "--- 容器挂载"
            docker inspect codeart-blog --format '{{json .Mounts}}'
            echo "--- 启动日志"
            docker logs --tail 20 codeart-blog || true

            echo "--- 健康检查（最多等 60 秒）"
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3040/api/health; then echo; ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "健康检查超时"
              docker logs --tail 60 codeart-blog
              exit 1
            fi

            echo "--- 线上 bundle"
            curl -s http://127.0.0.1:3040/ | grep -o 'assets/index-[A-Za-z0-9_-]*\.js' || true
