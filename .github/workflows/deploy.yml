name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

concurrency:
  group: blog-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像并打包
        run: |
          docker build --platform linux/amd64 -t codeart-blog:latest .
          docker save codeart-blog:latest | gzip > blog-image.tgz
          tar -czf blog-content.tgz content

      - name: 上传镜像与文章到服务器
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          source: "blog-image.tgz,blog-content.tgz"
          target: "/tmp/blog-deploy"
          rm: true

      - name: 加载镜像并重建容器
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /www/wwwroot/my-blog
            tar -xzf /tmp/blog-deploy/blog-content.tgz
            gunzip -c /tmp/blog-deploy/blog-image.tgz | docker load
            docker compose up -d --force-recreate
            docker image prune -f
            rm -rf /tmp/blog-deploy
            curl -sf http://127.0.0.1:3040/api/health
